<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Journal 🤍</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="extra.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
</head>
<body class="journal-body" data-theme="paper">

  <button class="btn-icon" id="settingsGear" onclick="openSettings()" title="Settings">⚙️</button>

  <header class="journal-header">
    <div class="header-left">
      <span class="header-logo">♡ K &amp; J</span>
      <span class="anniversary" id="anniversary">Together since 08/06/2026</span>
      <span class="last-visited" id="lastVisited"></span>
    </div>
    <div class="header-center">
      <input type="text" id="searchInput" class="search-bar" placeholder="🔍 search our memories..."/>
    </div>
    <div class="header-right">
      <span class="sync-status" id="syncStatus" title="Sync status">●</span>
      <button class="btn-random" onclick="openRandomNote()">🎲 Surprise</button>
      <button class="btn-new" onclick="openEditor()">✏️ New Entry</button>
    </div>
  </header>

  <div class="daily-quote-bar" id="dailyQuote"></div>

  <main class="notes-canvas" id="notesCanvas">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📖</div>
      <div class="empty-text">Your journal is empty...<br/>Write your first memory ✨</div>
    </div>
    <div class="loading-state" id="loadingState">
      <div class="loading-text">Loading your memories... ☕</div>
    </div>
  </main>

  <div class="modal-overlay" id="settingsOverlay" onclick="closeSettingsOnOverlay(event)">
    <div class="settings-panel">
      <button class="modal-close" onclick="closeSettings()">✕</button>
      <h2 class="settings-title">Settings</h2>
      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="paper" onclick="setTheme('paper')">Soft Paper</button>
          <button class="theme-btn" data-theme="night" onclick="setTheme('night')">Dark Night</button>
          <button class="theme-btn" data-theme="rose" onclick="setTheme('rose')">Rose</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Default Font</div>
        <div class="font-selector settings-fonts">
          <button class="font-btn active" data-font="handwriting" onclick="selectFont('handwriting', true)">Handwriting</button>
          <button class="font-btn" data-font="elegant" onclick="selectFont('elegant', true)">Elegant</button>
          <button class="font-btn" data-font="clean" onclick="selectFont('clean', true)">Clean</button>
          <button class="font-btn" data-font="typewriter" onclick="selectFont('typewriter', true)">Typewriter</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Actions</div>
        <button class="settings-action-btn" onclick="printJournal()">🖨️ Print Journal</button>
      </div>
      <div class="settings-footer">Together since 08 June 2026</div>
    </div>
  </div>

  <div class="modal-overlay" id="editorOverlay" onclick="closeEditorOnOverlay(event)">
    <div class="editor-modal">
      <button class="modal-close" onclick="closeEditor()">✕</button>
      <div class="voice-selector">
        <button class="voice-btn active" id="voiceKunwar" onclick="selectVoice('Kunwar')">
          <span class="voice-dot kunwar-dot"></span> Kunwar
        </button>
        <button class="voice-btn" id="voiceJasmin" onclick="selectVoice('Jasmin')">
          <span class="voice-dot jasmin-dot"></span> Jasmin
        </button>
      </div>
      <div class="font-selector">
        <span class="font-label">Font</span>
        <button class="font-btn active" data-font="handwriting" onclick="selectFont('handwriting', true)">Handwriting</button>
        <button class="font-btn" data-font="elegant" onclick="selectFont('elegant', true)">Elegant</button>
        <button class="font-btn" data-font="clean" onclick="selectFont('clean', true)">Clean</button>
        <button class="font-btn" data-font="typewriter" onclick="selectFont('typewriter', true)">Typewriter</button>
      </div>
      <div class="mood-label">How are you feeling?</div>
      <div class="mood-grid" id="moodGrid"></div>
      <div class="editor-toolbar" id="editorToolbar">
        <div class="toolbar-group">
          <button class="tb" data-action="bold" title="Bold">𝐁</button>
          <button class="tb" data-action="italic" title="Italic"><i>I</i></button>
          <button class="tb" data-action="underline" title="Underline"><u>U</u></button>
          <button class="tb" data-action="strike" title="Strikethrough"><s>S</s></button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb" data-action="size-small" title="Small">aₛ</button>
          <button class="tb" data-action="size-normal" title="Normal">A</button>
          <button class="tb" data-action="size-large" title="Large">A⁺</button>
          <button class="tb" data-action="size-huge" title="Huge">A⁺⁺</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb" data-action="h1" title="H1">H1</button>
          <button class="tb" data-action="h2" title="H2">H2</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb" data-action="bullet" title="Bullet">• —</button>
          <button class="tb" data-action="numbered" title="Numbered">1.</button>
          <button class="tb" data-action="checklist" title="Checklist">☐</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb" data-action="align-left" title="Left">⬅</button>
          <button class="tb" data-action="align-center" title="Center">↔</button>
          <button class="tb" data-action="align-right" title="Right">➡</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb" data-action="divider" title="Divider">―</button>
          <button class="tb" data-action="quote" title="Quote">❝</button>
        </div>
      </div>
      <div class="editor-textarea" id="editorTextarea" contenteditable="true" spellcheck="true" data-placeholder="write here, love..."></div>
      <div class="media-section">
        <div class="media-row">
          <label class="media-btn">📷 Add Photo
            <input type="file" id="photoInput" accept="image/*" multiple hidden onchange="handlePhotoSelect(event)"/>
          </label>
          <button class="media-btn" id="voiceRecordBtn" onclick="toggleVoiceRecord()">🎤 Voice Note</button>
          <label class="media-btn">🎨 Custom Sticker
            <input type="file" id="stickerUploadInput" accept="image/*" hidden onchange="handleStickerUpload(event)"/>
          </label>
        </div>
        <div class="photo-preview" id="photoPreview"></div>
        <div class="voice-preview" id="voicePreview"></div>
      </div>
      <div class="sticker-section">
        <div class="sticker-label">🎨 Stickers</div>
        <div class="sticker-tray" id="stickerTray"></div>
      </div>
      <div class="editor-footer">
        <button class="btn-cancel" onclick="closeEditor()">Cancel</button>
        <button class="btn-save" onclick="saveEntry()">Save Entry 💾</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="viewOverlay" onclick="closeViewOnOverlay(event)">
    <div class="view-modal">
      <button class="modal-close" onclick="closeView()">✕</button>
      <button class="nav-arrow nav-prev" onclick="navigateNote(-1)" title="Previous">‹</button>
      <button class="nav-arrow nav-next" onclick="navigateNote(1)" title="Next">›</button>
      <div class="view-meta" id="viewMeta"></div>
      <div class="view-content" id="viewContent"></div>
      <div class="view-photos" id="viewPhotos"></div>
      <div class="view-voice" id="viewVoice"></div>
      <div class="view-stickers" id="viewStickers"></div>
      <div class="view-actions">
        <button class="btn-star-view" id="viewStarBtn" onclick="toggleStarFromView()">⭐ Star</button>
        <button class="btn-edit-view" onclick="editFromView()">✏️ Edit</button>
        <button class="btn-print-view" onclick="printCurrentNote()">🖨️ Print</button>
        <button class="btn-delete-view" onclick="deleteFromView()">🗑️ Delete</button>
      </div>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="app-extra.js"></script>
</body>
</html>
